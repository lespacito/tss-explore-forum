name: Build and publish preproduction images

on:
  workflow_dispatch:
  workflow_run:
    workflows: [Playwright Tests]
    types: [completed]
    branches: [dev]

permissions:
  contents: read
  actions: read
  packages: write

# Serializes publishers across branches and retries. Never cancel a push midway.
concurrency:
  group: parlons-violence-preprod-ghcr
  cancel-in-progress: false

env:
  APP_IMAGE: ghcr.io/lespacito/parlons-violence-preprod-app
  MIGRATE_IMAGE: ghcr.io/lespacito/parlons-violence-preprod-migrate

jobs:
  publish:
    if: >-
      github.repository == 'lespacito/tss-explore-forum' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev') ||
       (github.event_name == 'workflow_run' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'dev' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # This guard belongs to the trusted workflow, never to the application checkout.
      - name: Verify successful CI for the current dev SHA
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/verify-preprod-ci.py" <<'CI_GUARD'
          import json
          import os
          import re
          import urllib.parse
          import urllib.request

          REPO = 'lespacito/tss-explore-forum'
          WORKFLOW = '.github/workflows/playwright.yml'


          def require(condition, message):
              if not condition:
                  raise RuntimeError(message)


          def api(path):
              request = urllib.request.Request(
                  f'{os.environ["GITHUB_API_URL"]}/repos/{REPO}/{path}',
                  headers={'Authorization': f'Bearer {os.environ["GH_TOKEN"]}',
                           'Accept': 'application/vnd.github+json',
                           'X-GitHub-Api-Version': '2022-11-28'},
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)


          def verify(event_name, event, source_sha=None, ci_run_id=None, ci_attempt=None):
              require(os.environ['GITHUB_REPOSITORY'] == REPO, 'Unexpected repository')
              if event_name == 'workflow_run':
                  trigger = event['workflow_run']
                  require(event.get('action') == 'completed', 'Unexpected activity')
                  require(trigger['head_repository']['full_name'] == REPO, 'Foreign source repository')
                  require(trigger['event'] == 'push' and trigger['head_branch'] == 'dev', 'Expected dev push CI')
                  require(trigger['status'] == 'completed' and trigger['conclusion'] == 'success', 'CI did not succeed')
                  sha = trigger['head_sha']
              else:
                  require(event_name == 'workflow_dispatch', 'Unexpected trigger')
                  require(os.environ['GITHUB_REF'] == 'refs/heads/dev', 'Dispatch must target dev')
                  sha = os.environ['GITHUB_SHA']
              require(re.fullmatch('[0-9a-f]{40}', sha) is not None, 'Invalid source SHA')
              require(source_sha is None or sha == source_sha, 'Source SHA changed')
              require(api('git/ref/heads/dev')['object']['sha'] == sha, 'Obsolete source: dev has advanced')
              workflow = api('actions/workflows/playwright.yml')
              require(workflow['path'] == WORKFLOW and workflow['name'] == 'Playwright Tests'
                      and workflow['state'] == 'active', 'Unexpected CI workflow')
              query = urllib.parse.urlencode({'branch': 'dev', 'event': 'push', 'head_sha': sha, 'per_page': 1})
              runs = api(f'actions/workflows/{workflow["id"]}/runs?{query}')['workflow_runs']
              require(bool(runs), 'No push CI for this SHA')
              # Never fall back to an older successful run while a newer run/attempt fails or runs.
              run = api(f'actions/runs/{runs[0]["id"]}')
              require(run['workflow_id'] == workflow['id'] and run['path'] == WORKFLOW, 'Wrong workflow identity')
              require(run['head_repository']['full_name'] == REPO, 'Foreign CI repository')
              require(run['event'] == 'push' and run['head_branch'] == 'dev' and run['head_sha'] == sha,
                      'CI source mismatch')
              require(run['status'] == 'completed' and run['conclusion'] == 'success', 'Latest CI is not successful')
              if event_name == 'workflow_run':
                  require(run['id'] == trigger['id'] and run['run_attempt'] == trigger['run_attempt'],
                          'Obsolete CI completion or attempt')
              require(ci_run_id is None or str(run['id']) == ci_run_id, 'CI run changed during build')
              require(ci_attempt is None or str(run['run_attempt']) == ci_attempt, 'CI attempt changed during build')
              # Re-read after CI queries, including when called immediately before each push.
              require(api('git/ref/heads/dev')['object']['sha'] == sha, 'Obsolete source: dev has advanced')
              return sha, str(run['id']), str(run['run_attempt'])


          def main():
              with open(os.environ['GITHUB_EVENT_PATH']) as stream:
                  event = json.load(stream)
              sha, run_id, attempt = verify(os.environ['GITHUB_EVENT_NAME'], event,
                                            os.environ.get('SOURCE_SHA'), os.environ.get('CI_RUN_ID'),
                                            os.environ.get('CI_RUN_ATTEMPT'))
              with open(os.environ['GITHUB_ENV'], 'a') as stream:
                  stream.write(f'SOURCE_SHA={sha}\nCI_RUN_ID={run_id}\nCI_RUN_ATTEMPT={attempt}\n')
              print(f'Verified dev SHA {sha}, Playwright push run {run_id}, attempt {attempt}')


          if __name__ == '__main__':
              main()
          CI_GUARD
          python3 "$RUNNER_TEMP/verify-preprod-ci.py"

      - name: Checkout the tested dev source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          path: source
          persist-credentials: false

      - name: Verify source SHA and Dockerfile contract
        id: source
        run: |
          set -euo pipefail
          actual_sha=$(git -C source rev-parse HEAD)
          test "$actual_sha" = "$SOURCE_SHA"
          test "$(sed -n '1p' source/Dockerfile)" = 'FROM oven/bun:1-alpine AS base'
          grep -qx 'FROM base AS builder' source/Dockerfile
          grep -qx 'FROM base AS runner' source/Dockerfile
          test -s source/bun.lock
          test -s source/drizzle.config.ts
          test -s source/drizzle/meta/_journal.json
          echo "actual_sha=$actual_sha" >> "$GITHUB_OUTPUT"
          echo "SHA_TAG=sha-$actual_sha" >> "$GITHUB_ENV"
          echo "RUN_TAG=sha-$actual_sha-run-$GITHUB_RUN_ID-attempt-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"

      - name: Configure the BuildKit mirror on the ephemeral CI runner
        run: |
          set -euo pipefail
          # Never restart a daemon with running workloads. This is a GitHub runner only.
          test -z "$(docker ps -q)"
          sudo python3 - /etc/docker/daemon.json <<'DOCKER_MIRROR'
          import json
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          config = json.loads(path.read_text()) if path.exists() else {}
          if not isinstance(config, dict):
              raise SystemExit('Expected a Docker daemon configuration object')
          mirrors = config.get('registry-mirrors', [])
          if not isinstance(mirrors, list) or not all(isinstance(url, str) for url in mirrors):
              raise SystemExit('Expected a list of registry mirror URLs')
          mirror = 'https://mirror.gcr.io'
          config['registry-mirrors'] = [mirror] + [url for url in mirrors if url.rstrip('/') != mirror]
          path.write_text(json.dumps(config, indent=2) + '\n')
          DOCKER_MIRROR
          sudo systemctl restart docker

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          # Pinned upstream image; Docker's configured mirror handles the download.
          driver-opts: |
            image=moby/buildkit@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea

      - name: Authenticate to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare strict registry collision guard
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/check-preprod-tags.sh" <<'GUARD'
          set -euo pipefail
          for image in "$APP_IMAGE" "$MIGRATE_IMAGE"; do
            repository=${image#ghcr.io/}
            token=$(curl --fail --silent --show-error \
              --user "$GITHUB_ACTOR:$GHCR_TOKEN" \
              "https://ghcr.io/token?service=ghcr.io&scope=repository:$repository:pull" \
              | jq -er '.token // .access_token')
            echo "::add-mask::$token"
            for tag in "$SHA_TAG" "$RUN_TAG"; do
              status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
                --header "Authorization: Bearer $token" \
                --header 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json' \
                "https://ghcr.io/v2/$repository/manifests/$tag")
              case "$status" in
                404) ;;
                200) echo "::error::Refusing to overwrite $image:$tag"; exit 1 ;;
                *) echo "::error::Cannot prove absence of $image:$tag (HTTP $status)"; exit 1 ;;
              esac
            done
          done
          GUARD
          bash "$RUNNER_TEMP/check-preprod-tags.sh"

      - name: Resolve the amd64 base image once
        id: base
        run: |
          set -euo pipefail
          docker buildx imagetools inspect --raw oven/bun:1-alpine > "$RUNNER_TEMP/bun-index.json"
          digest=$(jq -er '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64")] | if length == 1 then .[0].digest else error("Expected one linux/amd64 base manifest") end' "$RUNNER_TEMP/bun-index.json")
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "BASE_DIGEST=$digest" >> "$GITHUB_ENV"
          echo "BASE_REF=docker.io/oven/bun@$digest" >> "$GITHUB_ENV"

      - name: Build both targets without publishing
        run: |
          set -euo pipefail
          common=(
            --platform linux/amd64 --load --provenance=false
            --file source/Dockerfile
            --build-context "oven/bun:1-alpine=docker-image://$BASE_REF"
            --build-arg 'VITE_APP_NAME=Parlons Violence — Préproduction'
            --build-arg 'VITE_APP_URL=https://preprod.parlonsviolence.ch'
            --build-arg 'VITE_BETTER_AUTH_URL=https://preprod.parlonsviolence.ch'
            --build-arg 'VITE_ENABLE_OAUTH=false'
            --label "org.opencontainers.image.revision=$SOURCE_SHA"
            --label 'org.opencontainers.image.source=https://github.com/lespacito/tss-explore-forum'
            --label "org.opencontainers.image.base.name=$BASE_REF"
            --label "org.opencontainers.image.base.digest=$BASE_DIGEST"
          )
          docker buildx build "${common[@]}" --target builder \
            --label 'org.opencontainers.image.title=Parlons Violence — Préproduction migrations' \
            --tag "$MIGRATE_IMAGE:$RUN_TAG" source
          docker buildx build "${common[@]}" --target runner \
            --label 'org.opencontainers.image.title=Parlons Violence — Préproduction application' \
            --tag "$APP_IMAGE:$RUN_TAG" source
          for image in "$APP_IMAGE" "$MIGRATE_IMAGE"; do
            test "$(docker image inspect "$image:$RUN_TAG" --format '{{.Os}}/{{.Architecture}}')" = linux/amd64
          done

      - name: Verify migration payload offline without executing it
        run: |
          set -euo pipefail
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --entrypoint bun "$MIGRATE_IMAGE:$RUN_TAG" -e '
              const fs = require("node:fs");
              const assert = require("node:assert/strict");
              assert(fs.statSync("/app/drizzle.config.ts").size > 0);
              const journal = JSON.parse(fs.readFileSync("/app/drizzle/meta/_journal.json", "utf8"));
              assert(journal.entries.length > 0);
              for (const { tag } of journal.entries) {
                assert(/^[a-zA-Z0-9_-]+$/.test(tag));
                assert(fs.statSync(`/app/drizzle/${tag}.sql`).size > 0);
              }
              const kit = JSON.parse(fs.readFileSync("/app/node_modules/drizzle-kit/package.json", "utf8"));
              assert(kit.name === "drizzle-kit" && kit.version);
              fs.accessSync("/app/node_modules/.bin/drizzle-kit", fs.constants.X_OK);
              console.log(`Verified ${journal.entries.length} SQL migrations and drizzle-kit ${kit.version}`);
            '

      - name: Recheck CI and dev immediately before publication
        run: python3 "$RUNNER_TEMP/verify-preprod-ci.py"

      - name: Recheck all tags immediately before publication
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash "$RUNNER_TEMP/check-preprod-tags.sh"

      - name: Publish and verify exact registry digests
        run: |
          set -euo pipefail
          for image in "$APP_IMAGE" "$MIGRATE_IMAGE"; do
            python3 "$RUNNER_TEMP/verify-preprod-ci.py"
            docker push "$image:$RUN_TAG"
            run_digest=$(docker buildx imagetools inspect "$image:$RUN_TAG" --format '{{.Manifest.Digest}}')
            [[ "$run_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            printf '| `%s` | `%s` | `%s@%s` |\n' \
              "$image" "$RUN_TAG" "$image" "$run_digest" >> "$RUNNER_TEMP/published-images.md"
            docker tag "$image:$RUN_TAG" "$image:$SHA_TAG"
            python3 "$RUNNER_TEMP/verify-preprod-ci.py"
            docker push "$image:$SHA_TAG"
            sha_digest=$(docker buildx imagetools inspect "$image:$SHA_TAG" --format '{{.Manifest.Digest}}')
            test "$sha_digest" = "$run_digest"
            printf '| `%s` | `%s` | `%s@%s` |\n' \
              "$image" "$SHA_TAG" "$image" "$sha_digest" >> "$RUNNER_TEMP/published-images.md"
          done

      - name: Publication summary
        if: always()
        env:
          ACTUAL_SHA: ${{ steps.source.outputs.actual_sha }}
          BASE_DIGEST: ${{ steps.base.outputs.digest }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          {
            echo '## Preproduction image publication'
            echo "Status: $JOB_STATUS"
            echo "Source HEAD verified: ${ACTUAL_SHA:-not verified}"
            echo "Verified Playwright push CI: ${CI_RUN_ID:-not verified} / attempt: ${CI_RUN_ATTEMPT:-not verified}"
            echo "Run: $GITHUB_RUN_ID / attempt: $GITHUB_RUN_ATTEMPT"
            echo "Platform: linux/amd64"
            echo "Requested tags: ${SHA_TAG:-not prepared}, ${RUN_TAG:-not prepared}"
            echo "Resolved base: docker.io/oven/bun@${BASE_DIGEST:-not resolved} (from oven/bun:1-alpine)"
            echo
            echo '| Image | Tags | Verified registry digest reference |'
            echo '| --- | --- | --- |'
            if [[ -f "$RUNNER_TEMP/published-images.md" ]]; then
              cat "$RUNNER_TEMP/published-images.md"
            else
              echo 'No image publication verified. Inspect the failed step before retrying.'
            fi
            echo
            echo 'A failed push can leave a partial publication. Existing tags are never intentionally replaced.'
          } >> "$GITHUB_STEP_SUMMARY"
