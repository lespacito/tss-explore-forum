name: Playwright Tests
on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-26.04
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: pirate101
          POSTGRES_DB: parlons_violence_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d parlons_violence_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '26.13.0'
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: 1.4.2
    - name: Install dependencies
      run: bun install --frozen-lockfile
    - name: Typecheck
      run: bun run typecheck
    - name: Unit tests
      run: bun run test:unit
    - name: Prepare E2E database
      run: |
        bun run test:e2e:migrate
        bun run test:e2e:seed
    - name: Install Playwright Browsers
      run: bunx playwright install --with-deps
    - name: Run Playwright tests
      run: bun run test:e2e
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
