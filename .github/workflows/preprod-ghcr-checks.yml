name: Preproduction publisher guard tests

on:
  pull_request:
    branches: [dev, master]
    paths:
      - .github/workflows/preprod-ghcr.yml
      - .github/workflows/preprod-ghcr-checks.yml
      - tests/ci/**
  push:
    branches: [dev, master]
    paths:
      - .github/workflows/preprod-ghcr.yml
      - .github/workflows/preprod-ghcr-checks.yml
      - tests/ci/**

permissions:
  contents: read

jobs:
  guards:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test publisher admission and freshness guards without publishing
        run: python3 -m unittest discover -s tests/ci -v
